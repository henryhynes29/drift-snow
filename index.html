    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Do I need a contract or subscription?", "acceptedAnswer": {"@type": "Answer", "text": "No. DRIFT is pay-per-storm — you're only charged when a plow actually clears your driveway. No contracts, no monthly fees, no commitment."}}, {"@type": "Question", "name": "How much does it cost to plow a driveway in Duluth?", "acceptedAnswer": {"@type": "Answer", "text": "You outline your driveway once and we recommend a price from its size, slope and the snow depth. You can offer more or less. Most single-car driveways come in around $49–$54 and most two-car driveways around $58–$64 per storm, including the $10 call-out fee that goes to your driver and the $5 DRIFT booking fee. Offer more for a faster pickup mid-storm. You're only charged when it's done."}}, {"@type": "Question", "name": "How fast can someone come plow?", "acceptedAnswer": {"@type": "Answer", "text": "Book whenever you need it. Your offer goes out to local drivers right away, and once one accepts you can watch them head over live. Arrival depends on who's out and how busy the storm is — raising your offer helps during big storms."}}, {"@type": "Question", "name": "What areas do you serve?", "acceptedAnswer": {"@type": "Answer", "text": "Duluth, Hermantown, Cloquet, Esko, Proctor, and Superior, Wisconsin — the greater Twin Ports and Northland."}}, {"@type": "Question", "name": "Can I schedule a plow before a storm?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Pick a day and a 2-hour window up to 6 days ahead. Your card is held when you book and only charged once the job is done."}}, {"@type": "Question", "name": "When do I have to clear my sidewalk in Duluth?", "acceptedAnswer": {"@type": "Answer", "text": "Within 24 hours after the snowfall ends, across the full width of the walk. You can add sidewalk clearing to the same booking as your driveway."}}, {"@type": "Question", "name": "Who does the plowing?", "acceptedAnswer": {"@type": "Answer", "text": "Independent local plow operators who use DRIFT to find jobs. They're not DRIFT employees — DRIFT is the app that connects you, handles booking and payment, and gives you live tracking and photos."}}]}</script>
